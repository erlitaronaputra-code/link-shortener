<script>
  // Mencegah error skrip luar merusak aplikasi
  window.addEventListener('error', function(e) {
    if (e.filename && !e.filename.includes('index.html')) {
      e.stopImmediatePropagation();
    }
  }, true);

  // URL Web App Google Apps Script Aktif (Versi 58 Utuh)
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzrrFgSzqBAYpmB6tdXKA67iIsH9w6PrZ_xZCrUYmoaMWFTwcl5GGuhD8Vrs2Zbn4g8Tw/exec";

  document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('c');

    if (code) {
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      const script = document.createElement('script');
      script.src = `${GAS_URL}?c=${encodeURIComponent(code)}&callback=handleRedirect`;
      script.onerror = function() {
        document.getElementById('loading').innerText = 'Gagal terhubung ke database!';
      };
      document.body.appendChild(script);
    }
  });

  function handleRedirect(response) {
    if (response && response.success && response.targetUrl) {
      window.location.href = response.targetUrl;
    } else {
      document.getElementById('loading').innerText = (response && response.message) ? response.message : 'Kode link tidak ditemukan!';
    }
  }

  function shortenLink() {
    const longUrl = document.getElementById('longUrl').value.trim();
    const customCode = document.getElementById('customCode').value.trim().toLowerCase();

    if (!longUrl) {
      alert('Harap masukkan URL panjang!');
      return;
    }

    const formData = new URLSearchParams();
    formData.append('url', longUrl);
    formData.append('customCode', customCode);

    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: formData.toString()
    }).then(() => {
      const finalCode = customCode || Math.random().toString(36).substring(2, 7);
      const shortUrl = window.location.origin + window.location.pathname + '?c=' + finalCode;

      const linkElem = document.getElementById('shortLink');
      linkElem.href = shortUrl;
      linkElem.innerText = shortUrl;
      document.getElementById('result').style.display = 'block';
      alert('Link berhasil dibuat!');
    }).catch(err => {
      alert('Gagal menyimpan link: ' + err);
    });
  }

  function copyLink() {
    const shortUrl = document.getElementById('shortLink').href;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(shortUrl).then(() => {
        alert('Link berhasil disalin ke clipboard!');
      }).catch(() => {
        fallbackCopyTextToClipboard(shortUrl);
      });
    } else {
      fallbackCopyTextToClipboard(shortUrl);
    }
  }

  function fallbackCopyTextToClipboard(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      alert('Link berhasil disalin!');
    } catch (err) {
      alert('Gagal menyalin link otomatis, silakan salin secara manual.');
    }
    document.body.removeChild(textArea);
  }
</script>
